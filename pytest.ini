[pytest]
# 测试文件匹配模式
python_files = test*.py *_test.py

# 测试类匹配模式
python_classes = Test*

# 测试函数匹配模式
python_functions = test_*

# 测试路径
testpaths = tests

# 最小 Python 版本
minversion = 6.0

# 添加默认参数
addopts = 
    -v
    --strict-markers
    --tb=short

# pytest-asyncio 配置
asyncio_default_fixture_loop_scope = function
asyncio_mode = auto
